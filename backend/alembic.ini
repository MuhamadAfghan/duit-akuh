[alembic]
script_location = alembic
prepend_sys_path = .
# Timestamped, readable revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
# The URL is read from DATABASE_URL in alembic/env.py; it is deliberately
# absent here so a connection string never lands in version control.
sqlalchemy.url =

[post_write_hooks]
# Run through `python -m` so the hook finds ruff inside the virtualenv
# rather than needing it on PATH; ruff also has no console_scripts
# entrypoint for Alembic to import, so `console_scripts` will not work.
hooks = ruff
ruff.type = exec
ruff.executable = python
ruff.options = -m ruff format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
