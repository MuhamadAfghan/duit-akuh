<!--
  App icon source. All PWA icons in public/icons/ are generated from this
  file by `npm run gen:icons` (scripts/generate-icons.mjs).

  The mark is a spirit level: a flat line with the bubble dead centre.
  It stands for the ledger rule the whole app rests on - every
  transaction is recorded on two sides and has to sum to exactly zero.

  Artwork is kept inside the centre 80% so the same drawing is safe to
  use as a maskable icon, where platforms may crop to a circle. Below
  24px the lines disappear and only the dot is drawn; see the brand
  sheet on the design canvas.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="lega">
  <rect width="512" height="512" rx="143" fill="#009A5B" />
  <path d="M128 256 H188" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" />
  <path d="M324 256 H384" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" />
  <circle cx="256" cy="256" r="47" fill="#FFFFFF" />
</svg>
