name: Deploy ke VPS

# Push ke `main` deploy ke produksi.
# Bisa juga dijalankan manual: Actions -> Deploy ke VPS -> Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependency
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        working-directory: backend
        run: ruff check .

      # Integration tests need a live database and are skipped without
      # TEST_DATABASE_URL. The production Postgres only listens on the VPS
      # loopback, so the runner cannot reach it; the pure money rules still
      # run here.
      - name: Pytest (aturan murni)
        working-directory: backend
        run: python -m pytest -q -m "not integration"

  deploy:
    name: Build & deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          # Same major as the VPS runtime.
          node-version: '22'
          cache: npm

      - name: Install dependency
        run: npm ci --engine-strict=false

      - name: Build frontend (standalone)
        env:
          BUILD_STANDALONE: '1'
          # Baked into routes-manifest.json at build time. The frontend and
          # the API run side by side on the VPS, so the loopback address is
          # what the Next server proxies /srv/* to.
          BACKEND_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Bangun artifact frontend
        run: |
          # `standalone` omits these two on purpose: static assets and
          # public/ are expected to sit alongside server.js.
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          tar -czf /tmp/release-web.tar.gz -C .next/standalone .
          ls -lh /tmp/release-web.tar.gz

      - name: Bangun artifact backend
        run: |
          stage="$(mktemp -d)"
          cp -r backend/app backend/alembic "$stage/"
          cp backend/alembic.ini backend/requirements-prod.txt "$stage/"
          find "$stage" -name '__pycache__' -type d -prune -exec rm -rf {} +
          tar -czf /tmp/release-api.tar.gz -C "$stage" .
          ls -lh /tmp/release-api.tar.gz

      - name: Siapkan SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Cek koneksi SSH
        run: |
          if ! ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
                   -o ConnectTimeout=25 "$SSH_USER@$SSH_HOST" 'echo ok'; then
            echo "::error::Tidak bisa SSH ke $SSH_HOST:$SSH_PORT dari runner GitHub."
            echo "::error::Cek firewall VPS (port $SSH_PORT harus terbuka untuk runner GitHub) dan secret SSH_*."
            exit 1
          fi

      - name: Kirim artifact
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
              "$SSH_USER@$SSH_HOST" 'mkdir -p ~/deploy'
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
              /tmp/release-api.tar.gz "$SSH_USER@$SSH_HOST:~/deploy/api-${{ github.sha }}.tar.gz"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
              /tmp/release-web.tar.gz "$SSH_USER@$SSH_HOST:~/deploy/web-${{ github.sha }}.tar.gz"

      # Backend dan frontend diaktifkan sekaligus di VPS: migrasi, restart,
      # health check, dan auto-rollback ada di duitakuh-post-deploy.
      - name: Aktifkan release
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes \
              "$SSH_USER@$SSH_HOST" 'bash -s' -- \
              "/home/$SSH_USER/deploy/api-${{ github.sha }}.tar.gz" \
              "/home/$SSH_USER/deploy/web-${{ github.sha }}.tar.gz" \
              < deploy/activate.sh

      - name: Bersihkan kunci
        if: always()
        run: rm -f ~/.ssh/deploy_key
